name: RDP by DucThang x TrueHieu (V7 - Chốt Hạ Tuyệt Đối)

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Server URL for logs'
        required: false
      machine_id:
        description: 'Machine ID for logs'
        required: false
  schedule:
    - cron: "0 */5 * * *"

concurrency:
  group: vps-bore-runner
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 1440

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛠️ Setup Logging Helper
        shell: pwsh
        run: |
          $code = @'
          param([string]$message)
          Write-Host "[SYSTEM LOG]: $message"
          $serverUrl = "${{ github.event.inputs.server_url }}"
          $machineId = "${{ github.event.inputs.machine_id }}"
          if ($serverUrl -and $machineId) {
            try {
              $body = @{ machineId = $machineId; message = $message } | ConvertTo-Json -Compress
              Invoke-RestMethod -Uri "$serverUrl/api/machine-log" -Method Post -Body $body -ContentType "application/json" -TimeoutSec 10 | Out-Null
            } catch {
              Write-Host "Failed to report log to server: $_"
            }
          }
          '@
          $code | Out-File -FilePath "report-log.ps1" -Encoding UTF8

      - name: Download and Extract Bore
        shell: pwsh
        run: |
          .\report-log.ps1 "📥 Đang tải và giải nén Bore..."
          Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-pc-windows-msvc.zip" -OutFile bore.zip
          Expand-Archive bore.zip -DestinationPath bore
          .\report-log.ps1 "✅ Đã tải Bore."

      - name: Enable RDP + Create Admin User
        shell: pwsh
        run: |
          .\report-log.ps1 "👤 Cấu hình tài khoản Admin & RDP..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          $pass = ConvertTo-SecureString "WindowsRDP2026@" -AsPlainText -Force
          New-LocalUser "admin" -Password $pass -FullName "admin"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "admin"
          Add-LocalGroupMember -Group "Administrators" -Member "admin"
          .\report-log.ps1 "✅ Tạo tài khoản admin thành công (Pass: WindowsRDP2026@)."

      - name: Tối ưu Registry 4K
        shell: pwsh
        run: |
          .\report-log.ps1 "🚀 Đang cấu hình Registry tối ưu RDP 4K/120FPS..."
          $tsPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          if (!(Test-Path $tsPath)) { New-Item -Path $tsPath -Force }
          Set-ItemProperty -Path $tsPath -Name "fEnableVirtualizedGraphics" -Value 1 -Type DWord
          Set-ItemProperty -Path $tsPath -Name "MinFrameRate" -Value 120 -Type DWord
          .\report-log.ps1 "✅ Registry optimized."

      - name: Install BlueStacks 5 (Hyper-V Compatible + Kill Update Completely)
        shell: pwsh
        run: |
          .\report-log.ps1 "📱 Đang tải BlueStacks 5 offline installer..."
          $bsUrl = "https://cdn.bluestacks.com/public/recommended/downloads/v5.22.166.1003/BlueStacksFullInstaller_5.22.166.1003_amd64_native.exe"
          Invoke-WebRequest -Uri $bsUrl -OutFile "BSInstaller.exe"
          .\report-log.ps1 "✅ Đã tải BlueStacks installer."

          .\report-log.ps1 "⚙️ Cài đặt BlueStacks (Pie64 - Hyper-V compatible)..."
          Start-Process -FilePath ".\BSInstaller.exe" `
            -ArgumentList '-s','--defaultImageName','Pie64','--imageToLaunch','Pie64' `
            -Wait -NoNewWindow
          .\report-log.ps1 "✅ Cài đặt BlueStacks hoàn tất."

          # ============================================
          # TẦNG 1: Disable Service + Kill Process updater
          # ============================================
          .\report-log.ps1 "🚫 Tầng 1: Disable Updater Service..."
          Stop-Service -Name "BstHdUpdaterSvc" -Force -ErrorAction SilentlyContinue
          Set-Service -Name "BstHdUpdaterSvc" -StartupType Disabled -ErrorAction SilentlyContinue
          Get-Process -Name "HD-UpdaterService","HD-Agent","HD-NotificationService" -ErrorAction SilentlyContinue | 
            Stop-Process -Force -ErrorAction SilentlyContinue

          # ============================================
          # TẦNG 2: Registry - Disable auto-update hoàn toàn
          # ============================================
          .\report-log.ps1 "🚫 Tầng 2: Registry disable auto-update..."
          $regPaths = @(
            "HKLM:\SOFTWARE\BlueStacks_n5",
            "HKLM:\SOFTWARE\BlueStacksInstall_n5",
            "HKLM:\SOFTWARE\BlueStacks_n5\Guests\Android",
            "HKLM:\SOFTWARE\WOW6432Node\BlueStacks_n5"
          )
          foreach ($path in $regPaths) {
            if (Test-Path $path) {
              Set-ItemProperty -Path $path -Name "AutoUpdate" -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path $path -Name "CheckForUpdates" -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path $path -Name "UpdateChannel" -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path $path -Name "EnableUpdateCheck" -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
            }
          }
          # Disable scheduled tasks của BlueStacks
          Get-ScheduledTask -TaskName "*BlueStacks*" -ErrorAction SilentlyContinue | 
            Disable-ScheduledTask -ErrorAction SilentlyContinue
          Get-ScheduledTask -TaskName "*BstHd*" -ErrorAction SilentlyContinue | 
            Disable-ScheduledTask -ErrorAction SilentlyContinue

          # ============================================
          # TẦNG 3: Rename file updater + agent
          # ============================================
          .\report-log.ps1 "🚫 Tầng 3: Rename updater executables..."
          $bsDir = "C:\Program Files\BlueStacks_n5"
          $filesToKill = @(
            "HD-UpdaterService.exe",
            "HD-Agent.exe",
            "HD-NotificationService.exe"
          )
          foreach ($file in $filesToKill) {
            $fullPath = Join-Path $bsDir $file
            if (Test-Path $fullPath) {
              Rename-Item $fullPath "$file.bak" -Force -ErrorAction SilentlyContinue
              .\report-log.ps1 "  ✅ Đã rename $file"
            }
          }

          # ============================================
          # TẦNG 4: Hosts file - Block server update
          # ============================================
          .\report-log.ps1 "🚫 Tầng 4: Block update servers via hosts file..."
          $hostsPath = "$env:WINDIR\System32\drivers\etc\hosts"
          $domainsToBlock = @(
            "update.bluestacks.com",
            "updates.bluestacks.com",
            "bsclogics.com",
            "www.bsclogics.com",
            "sns.bluestacks.com",
            "cloud.bluestacks.com"
          )
          $hostsContent = Get-Content $hostsPath -ErrorAction SilentlyContinue
          $newEntries = $domainsToBlock | ForEach-Object { 
            if ($hostsContent -notmatch $_) { "127.0.0.1 $_" }
          } | Where-Object { $_ }
          if ($newEntries) {
            Add-Content -Path $hostsPath -Value "`n# BlueStacks Update Block" -ErrorAction SilentlyContinue
            Add-Content -Path $hostsPath -Value $newEntries -ErrorAction SilentlyContinue
            .\report-log.ps1 "  ✅ Đã block $($newEntries.Count) domains"
          }

          # ============================================
          # TẦNG 5: Windows Firewall - Block outbound
          # ============================================
          .\report-log.ps1 "🚫 Tầng 5: Firewall block BlueStacks updater..."
          $fwFiles = @(
            "C:\Program Files\BlueStacks_n5\HD-UpdaterService.exe",
            "C:\Program Files\BlueStacks_n5\HD-Agent.exe",
            "C:\Program Files\BlueStacks_n5\HD-Player.exe",
            "C:\Program Files\BlueStacks_n5\BlueStacks.exe"
          )
          foreach ($fw in $fwFiles) {
            if (Test-Path $fw) {
              $name = [System.IO.Path]::GetFileNameWithoutExtension($fw)
              New-NetFirewallRule -DisplayName "Block $name Update" -Direction Outbound `
                -Program $fw -Action Block -Profile Any -ErrorAction SilentlyContinue | Out-Null
            }
          }
          Get-ChildItem "$bsDir\*.bak" -ErrorAction SilentlyContinue | ForEach-Object {
            New-NetFirewallRule -DisplayName "Block $($_.Name)" -Direction Outbound `
              -Program $_.FullName -Action Block -Profile Any -ErrorAction SilentlyContinue | Out-Null
          }

          # ============================================
          # TẦNG 6: bluestacks.conf - Disable update trong config
          # ============================================
          .\report-log.ps1 "🚫 Tầng 6: bluestacks.conf disable update..."
          $confPath = "C:\ProgramData\BlueStacks_n5\bluestacks.conf"
          if (Test-Path $confPath) {
            $conf = Get-Content $confPath
            $updated = $conf | ForEach-Object {
              if ($_ -match 'auto_update|autoUpdate|check_for_update|enableUpdateCheck') {
                $_ -replace 'true', 'false' -replace '1', '0'
              } else { $_ }
            }
            $needAdd = $true
            foreach ($line in $updated) {
              if ($line -match 'auto_update') { $needAdd = $false; break }
            }
            if ($needAdd) { $updated += 'auto_update="false"' }
            $updated | Set-Content $confPath -Force
            .\report-log.ps1 "  ✅ Đã patch bluestacks.conf"
          }

          .\report-log.ps1 "✅ Đã chặn hoàn toàn auto-update BlueStacks (6 tầng)."

      - name: Monitor Bore Stream & Force Update File
        shell: pwsh
        run: |
          .\report-log.ps1 "🌐 Khởi chạy Bore stream..."
          $PASS = "WindowsRDP2026@"
          $USER = "admin"
          $lastFullAddress = ""

          # Cấu hình Git ép buộc
          git config --global user.name "TrueHieu-Bot"
          git config --global user.email "bot@trueteam.top"
          git config --global core.autocrlf false

          .\report-log.ps1 "🔍 Đang kết nối Bore Server..."

          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = ".\bore\bore.exe"
          $psi.Arguments = "local 3389 --to bore.pub"
          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $process = [System.Diagnostics.Process]::Start($psi)

          while (!$process.HasExited) {
              $line = $process.StandardOutput.ReadLine()
              if ($line) { Write-Host "[bore] $line" }
              if ($line -match "(?:listening at|remote forwarding at) (bore\.pub:\d+)") {
                  $fullAddress = $matches[1]
                  $portOnly = $fullAddress.Split(':')[1]

                  if ($fullAddress -ne $lastFullAddress) {
                      $lastFullAddress = $fullAddress
                      .\report-log.ps1 "✅ Mở port RDP thành công trên Bore: $fullAddress"
                      
                      if (Test-Path "rdp_info.txt") { Remove-Item "rdp_info.txt" -Force }

                      $createdAt = (Get-Date).ToString('HH:mm:ss dd/MM/yyyy')
                      $reportLines = @(
                        '=======================================================',
                        'RDP INFO - DucThang x TrueHieu Edition',
                        '=======================================================',
                        "FULL ADDRESS   : $fullAddress",
                        "PORT           : $portOnly",
                        'HOST           : bore.pub',
                        '-------------------------------------------------------',
                        "Username       : $USER",
                        "Password       : $PASS",
                        "Created        : $createdAt",
                        '======================================================='
                      )
                      $report = ($reportLines -join "`r`n")
                      [System.IO.File]::WriteAllText("$(Get-Location)\rdp_info.txt", $report)
                      
                      git checkout main
                      git add rdp_info.txt
                      git commit -m "Update RDP: $portOnly [skip ci]"
                      git push origin main --force
                      
                      .\report-log.ps1 "✅ Đã commit thông tin RDP lên repo: $fullAddress"
                  }
              }
              Start-Sleep -Milliseconds 200
          }
